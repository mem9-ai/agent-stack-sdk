name: SDK checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run test:service-contract
      - run: npm run typecheck
      - run: npm test
      - run: npm run pack:check
