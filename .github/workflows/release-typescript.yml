name: Release TypeScript SDK

on:
  push:
    tags:
      - "typescript-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run pack:check
      - run: test "$GITHUB_REF_NAME" = "typescript-v$(node -p \"require('./typescript/package.json').version\")"
      - run: npm publish --workspace @mem9/agent-stack --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
