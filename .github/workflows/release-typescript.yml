name: Release TypeScript SDK

on:
  push:
    tags:
      - "typescript-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run test:service-contract
      - run: npm run typecheck
      - run: npm test
      - run: npm run pack:check
      - run: test "$GITHUB_REF_NAME" = "typescript-v$(node -p 'require("./typescript/package.json").version')"
      - run: npm publish --workspace @mem9/tidb-link --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Record compatibility mapping
        run: |
          {
            echo "## Published TypeScript SDK"
            echo
            echo "- Package: \`@mem9/tidb-link@$(node -p 'require("./typescript/package.json").version')\`"
            echo "- SDK commit: \`$GITHUB_SHA\`"
            echo "- Text submission/history baseline: \`$(node -p 'require("./typescript/package.json").tidbLinkTextRevision')\`"
            echo "- Organization/End User/Key provisioning baseline: \`$(node -p 'require("./typescript/package.json").tidbLinkProvisioningRevision')\`"
            echo "- Template/Agent/Session lifecycle baseline: \`$(node -p 'require("./typescript/package.json").tidbLinkLifecycleRevision')\`"
            echo "- Realtime Model/Connection preparation baseline: \`$(node -p 'require("./typescript/package.json").tidbLinkRealtimeRevision')\`"
            echo "- TiDB Link API: \`$(node -p 'require("./typescript/package.json").tidbLinkApiVersion')\`"
          } >> "$GITHUB_STEP_SUMMARY"
